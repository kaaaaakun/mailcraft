<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailcraft demo</title>
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,'Segoe UI',sans-serif}
    #app{display:flex;flex-direction:column;height:100%}
    header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#111827;color:#fff}
    header b{margin-right:auto}
    header button{border:0;border-radius:6px;padding:6px 12px;background:#4f46e5;color:#fff;cursor:pointer}
    #editor{flex:1;min-height:0}
    dialog{width:min(900px,92vw);height:70vh;border:0;border-radius:10px;padding:0}
    dialog textarea{width:100%;height:calc(100% - 44px);border:0;padding:12px;font:12px ui-monospace,monospace;box-sizing:border-box}
    dialog form{text-align:right;padding:6px 10px}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <b>💌 Mailcraft</b>
      <button id="btn-html">Export HTML</button>
      <button id="btn-json">Export JSON</button>
      <button id="btn-copy">Copy HTML</button>
    </header>
    <div id="editor"></div>
  </div>
  <dialog id="dlg"><textarea id="out" readonly></textarea><form method="dialog"><button>Close</button></form></dialog>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
